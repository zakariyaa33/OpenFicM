name: Build custom Android APK
on:
  push:
    branches: [custom-reasoning]
    paths:
      - 'mobile-rn/**'
      - '.github/workflows/custom-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/ndk" || true
      - run: npm ci
      - run: npm run type-check
      - name: Verify DeepSeek presets
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { withDeepSeekEffort, deepSeekEffort, mergeRequestParameters, applyChatDeepSeekEffort, supportsChatDeepSeekEffort, isChatDeepSeekEffort } from './src/llm/request-parameters.ts';
          for (const effort of ['default','off','low','high','max']) {
            const json = withDeepSeekEffort('{"top_p":0.9}', effort);
            assert.equal(deepSeekEffort(json), effort);
            const out = mergeRequestParameters({model:'deepseek-v4-pro',messages:[]}, json);
            assert.equal(out.top_p, 0.9);
            assert.equal(out.model, 'deepseek-v4-pro');
            if (effort === 'default') assert.equal(out.thinking, undefined);
            else if (effort === 'off') assert.deepEqual(out.thinking, {type:'disabled'});
            else { assert.deepEqual(out.thinking, {type:'enabled'}); assert.equal(out.reasoning_effort, effort); }
          }
          assert.throws(() => mergeRequestParameters({}, '{"messages":[]}'));
          const saved = withDeepSeekEffort('{"top_p":0.9}', 'high');
          assert.equal(applyChatDeepSeekEffort(saved, 'follow'), saved);
          for (const effort of ['default','off','low','high','max']) {
            const override = applyChatDeepSeekEffort(saved, effort);
            assert.equal(deepSeekEffort(override), effort);
            assert.equal(JSON.parse(override).top_p, 0.9);
            assert.equal(deepSeekEffort(saved), 'high');
            assert.equal(isChatDeepSeekEffort(effort), true);
          }
          assert.equal(isChatDeepSeekEffort('middle'), false);
          const provider = {type:'openai-compatible',apiMode:'chat-completions',name:'DeepSeek',baseUrl:'https://api.deepseek.com/v1'};
          assert.equal(supportsChatDeepSeekEffort('deepseek-v4-pro', provider), true);
          assert.equal(supportsChatDeepSeekEffort('deepseek-v4-pro', {...provider,apiMode:'responses'}), false);
          assert.equal(supportsChatDeepSeekEffort('gpt', {...provider,name:'OpenAI',baseUrl:'https://api.openai.com/v1'}), false);
          NODE
      - name: Verify local API diagnostics
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { beginApiDebug, finishApiDebug, setApiDebugEnabled, getApiDebugEntries, clearApiDebug } from './src/llm/api-debug.ts';
          const input = { model:'test-model', provider:'Test', url:'https://example.test/v1/chat/completions?key=test-secret', body:JSON.stringify({model:'test-model',reasoning_effort:'low',api_key:'test-secret'}), apiKey:'test-secret', attempt:1, context:{agent:'Build',stage:'分析任务'} };
          assert.equal(beginApiDebug(input), undefined);
          assert.equal(getApiDebugEntries().length, 0);
          setApiDebugEnabled(true);
          const id = beginApiDebug(input);
          assert.equal(getApiDebugEntries()[0].context.agent, 'Build');
          assert.equal(JSON.parse(getApiDebugEntries()[0].request).reasoning_effort, 'low');
          finishApiDebug(id, {apiKey:'test-secret',status:200,raw:JSON.stringify({message:'Bearer test-secret'}),format:'JSON',data:{model:'returned-model',usage:{prompt_tokens:12,completion_tokens:8}}});
          const entry = getApiDebugEntries()[0];
          assert.equal(entry.returnedModel, 'returned-model');
          assert.equal(entry.usage.prompt_tokens, 12);
          assert.equal(entry.httpStatus, 200);
          assert.ok(!JSON.stringify(entry).includes('test-secret'));
          for(let i=0;i<25;i++) beginApiDebug(input);
          assert.equal(getApiDebugEntries().length,20);
          clearApiDebug();
          finishApiDebug(id,{apiKey:'test-secret',raw:'not restored'});
          assert.equal(getApiDebugEntries().length,0);
          beginApiDebug(input);
          setApiDebugEnabled(false);
          assert.equal(getApiDebugEntries().length,0);
          NODE
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.CUSTOM_ANDROID_KEYSTORE_BASE64 }}
          OPENFICM_RELEASE_STORE_PASSWORD: ${{ secrets.CUSTOM_ANDROID_STORE_PASSWORD }}
          OPENFICM_RELEASE_KEY_ALIAS: ${{ secrets.CUSTOM_ANDROID_KEY_ALIAS }}
          OPENFICM_RELEASE_KEY_PASSWORD: ${{ secrets.CUSTOM_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            export OPENFICM_RELEASE_STORE_FILE="$RUNNER_TEMP/openficm-custom.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$OPENFICM_RELEASE_STORE_FILE"
            chmod 600 "$OPENFICM_RELEASE_STORE_FILE"
            trap 'rm -f "$OPENFICM_RELEASE_STORE_FILE"' EXIT
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
            mkdir -p "$RUNNER_TEMP/custom-apk"
            cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/custom-apk/"
          else
            unset OPENFICM_RELEASE_STORE_PASSWORD OPENFICM_RELEASE_KEY_ALIAS OPENFICM_RELEASE_KEY_PASSWORD
            ./gradlew assembleStandalone --no-daemon -PreactNativeArchitectures=arm64-v8a
            mkdir -p "$RUNNER_TEMP/custom-apk"
            cp app/build/outputs/apk/standalone/*.apk "$RUNNER_TEMP/custom-apk/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFicM-Custom-APK
          path: ${{ runner.temp }}/custom-apk/*.apk
          if-no-files-found: error
